# Builds and publishes the add-on images. Manual trigger only: GitHub Actions
# minutes cost money, so run this only when a new image version is really needed.
# aarch64 builds on GitHub's native arm64 runner (no QEMU), amd64 on x86.
name: Build add-on images
on:
  workflow_dispatch:
    inputs:
      archs:
        description: "Architectures to build (comma separated: aarch64,amd64)"
        default: "aarch64"
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    if: ${{ contains(format(',{0},', github.event.inputs.archs), format(',{0},', matrix.arch)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          v=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' rtr-netztest/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: rtr-netztest
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/flowsworld/smartstamm-rtr-netztest-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/flowsworld/smartstamm-rtr-netztest-${{ matrix.arch }}:latest
