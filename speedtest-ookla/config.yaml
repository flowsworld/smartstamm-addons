name: Speedtest.net (Ookla CLI)
version: "0.1.0"
slug: speedtest_ookla
description: Scheduled Speedtest.net measurement with the official Ookla CLI against a fixed server, reported as Home Assistant sensors
url: https://github.com/flowsworld/smartstamm-addons/tree/main/speedtest-ookla
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
stdin: true
options:
  server_id: 818
  fallback_server_id: 73500
  minute: 0
  run_on_start: true
schema:
  server_id: int
  fallback_server_id: int?
  minute: int(0,59)
  run_on_start: bool
